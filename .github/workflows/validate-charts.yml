name: Validate charts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test chart editor
        run: node Tools/chart-editor/test_editor_core.mjs

      - name: Test chart server and manifest validation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest Tools/chart-editor/test_server.py Tools/test_build_manifest.py

      - name: Build release manifest from committed charts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 Tools/build_manifest.py --repo . --output-dir "$RUNNER_TEMP/chart-manifest"

      - name: Ask launcher repository to deploy /dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LAUNCHER_DISPATCH_TOKEN: ${{ secrets.LAUNCHER_DISPATCH_TOKEN }}
        run: |
          if [ -z "$LAUNCHER_DISPATCH_TOKEN" ]; then
            echo "LAUNCHER_DISPATCH_TOKEN is not configured; the launcher's scheduled sync will deploy this commit."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $LAUNCHER_DISPATCH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hichan0310/OverTempo_Launcher/dispatches \
            --data '{"event_type":"charts-updated"}'
